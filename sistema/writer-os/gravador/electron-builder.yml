# SPDX-License-Identifier: MPL-2.0
# O Gravador do Writer OS (npm run gravador:pacote; o CI gera os dois): Windows = um .exe portátil (sem
# instalar; pede a permissão de administrador só na hora de gravar), Linux = AppImage. Sem certificado de
# assinatura (DEC-P064; PLANO §12, linha 13): a página ekfrase.com/writer/os/ explica o aviso do SmartScreen.
appId: com.ekfrase.gravador
productName: Gravador Writer OS
copyright: Ekfrase (MPL-2.0)
directories:
  output: instalador
  buildResources: recursos
files:
  - package.json
  - dist/main.cjs
  - dist/preload.cjs
  - dist/trabalhador.cjs
  - dist/icone.png
  - dist/pagina/**/*
asar: true
# só as traduções do Chromium que a tela usa: o .exe portátil se descompacta a cada vez que abre, e menos
# arquivos = abre mais rápido (15/11/2026: "demora a abrir e parece que não abriu")
electronLanguages: [pt-BR, pt-PT, en-US]
npmRebuild: false
nodeGypRebuild: false
publish: null
win:
  target:
    - target: portable
      arch: [x64]
  icon: dist/icone.png
  # a janela roda como a pessoa; só o processo que grava pede a permissão (elevar.ts)
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
portable:
  artifactName: Gravador-Writer-OS.exe
  requestExecutionLevel: user
  # a tela de abertura enquanto o .exe se descompacta (pixel art por código: scripts/arte/writer-os.mjs)
  splashImage: recursos/splash.bmp
  # sempre a mesma pasta no %TEMP%: o antivírus e o Windows não tratam cada abertura como um programa novo
  unpackDirName: Gravador-Writer-OS
linux:
  executableName: ekfrase-gravador
  target:
    - target: AppImage
      arch: [x64]
  icon: dist/icone.png
  category: Utility
  artifactName: Gravador-Writer-OS.AppImage
  synopsis: Cria o pendrive do Ekfrase Writer OS
