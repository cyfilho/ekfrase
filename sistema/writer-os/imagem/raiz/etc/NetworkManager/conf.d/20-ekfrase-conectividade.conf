# O PORTAL CATIVO (Wi-Fi de hotel ou café que pede login numa página; PLANO §7, W4): o NetworkManager confere a
# internet neste endereço e diz "portal" quando a rede o intercepta. Tem de ser http (é o que o portal intercepta;
# o ekfrase.com força https e daria "portal" falso). O mesmo do pacote network-manager-config-connectivity-debian.
# A casca pergunta com `nmcli networking connectivity check` (sistema.ts) e abre a janela presa ao portal (portal.ts).
[connectivity]
uri=http://network-test.debian.org/nm
interval=300
