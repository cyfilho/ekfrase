#!/usr/sbin/nft -f
# SPDX-License-Identifier: MPL-2.0
# O firewall do Writer OS (Bloco D, análise de segurança de 20/11/2026): hoje nada escuta na rede, então isto
# não muda nada; protege se um dia algum serviço vier a escutar. Entrada negada, saída livre.
# Fica de fora: o que a pessoa começou (established/related), o loopback, o DHCP (a resposta do roteador),
# o ICMP e o ICMPv6 (a vizinhança do IPv6 e o ping de volta).
flush ruleset

table inet ekfrase {
  chain entrada {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    meta l4proto icmp accept
    meta l4proto icmpv6 accept
  }
  chain encaminhar {
    type filter hook forward priority 0; policy drop;
  }
}
