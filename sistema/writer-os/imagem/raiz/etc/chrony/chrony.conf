# A hora do Writer OS pela rede (o chrony no lugar do systemd-timesyncd, 18/11/2026).
#
# O RELÓGIO DA PLACA-MÃE NUNCA É GRAVADO. O Writer OS liga em computadores dos outros, quase sempre com Windows,
# que guarda nesse relógio a hora LOCAL. O timesyncd liga o "modo de 11 minutos" do kernel, que grava ali a hora
# em UTC: depois de usar o Writer OS, o Windows ligava 3 horas adiantado (o PC do Alcy, 18/11). Sem `rtcsync`, o
# chrony deixa o kernel sem gravar. O /etc/adjtime (LOCAL) faz o sistema LER o relógio como hora local, como o Windows.
pool 2.debian.pool.ntp.org iburst
# a hora pode chegar muito errada (o relógio lido num fuso diferente do do Windows): pula de uma vez nas 3 primeiras
makestep 1 3
# ninguém fala com o chrony (nem o chronyc): sem porta de comandos
cmdport 0
driftfile /var/lib/chrony/chrony.drift
