# Sem SysRq (PLANO §7). Os namespaces sem privilégio ficam ligados: é o sandbox do Chromium da
# casca, no lugar do chrome-sandbox SUID (que não vai na imagem).
kernel.sysrq = 0
kernel.unprivileged_userns_clone = 1
# O que espera na memória para ir ao disco (U2, 19/11): no máximo 64 MB, e começa a descer com 16 MB. O padrão (20% da
# memória, ~600 MB com 3 GB) deixava um download de atualização inteiro na memória para descer de uma vez no fim, com o
# banco dos textos (no mesmo pendrive ou disco) esperando junto; e um pendrive arrancado perdia mais.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
