# SPDX-License-Identifier: MPL-2.0
# O Ekfrase Writer OS e o Gravador: quando uma tag writer-os-v* chega aqui (por exemplo writer-os-v0.1.0,
# a mesma versão da casca do Writer), monta a imagem, roda os testes no QEMU, assina com o lacre da
# Ekfrase (minisign, segredo EKFRASE_MINISIGN_CHAVE), monta o Gravador no Windows (.exe portátil) e no
# Linux (AppImage) e cria o Release com tudo. O Gravador baixa a imagem deste Release; a página
# ekfrase.com/writer/os/ oferece o Gravador. Sem certificado de assinatura por enquanto.
# AS ATUALIZAÇÕES (docs/ATUALIZACOES.md §4, U1): o Release leva também o que os pendrives baixam para se atualizar
# sozinhos: ekfrase-writer-os-<v>.squashfs, .vmlinuz, .initrd, .grub.cfg e o manifesto .atualizacao.json com o lacre.
# E o Gravador se atualiza sozinho (U2, §5): ekfrase-gravador-<v>.atualizacao.json + o .minisig de cada Gravador.
# A CHAVE DO LACRE (revisão de segurança, achado 3; W4, 25/11/2026): o segredo vive só no environment `assinatura`
# (Settings → Environments: só as tags writer-os-v* e writer-v*), e só os jobs que assinam o pedem (`assinar` e
# `release`), num runner limpo, com os artefatos prontos. O job `imagem` roda o npm ci e o Docker e nunca vê a chave.
name: Writer OS e Gravador

on:
  push:
    tags: ['writer-os-v*']

permissions:
  contents: read

jobs:
  imagem:
    name: Imagem, testes no QEMU e o lacre
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      # espaço no disco do runner: os discos virtuais do QEMU crescem com o que a máquina grava (o teste de instalar e o
      # de atualizar pelo disco passam de 8 GB); sem isto, o disco do runner enchia e a gravação no disco interno parava
      - name: Liberar espaço no runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: sistema/writer-os/casca
      - name: A tag é a versão da casca (ou uma de teste dela, writer-os-vX.Y.Z-teste.N)
        run: |
          VERSAO=$(node -p "require('./sistema/writer-os/casca/package.json').version")
          [[ "$GITHUB_REF_NAME" =~ ^writer-os-v${VERSAO//./\\.}(-teste\.[0-9]+)?$ ]] || { echo "A tag ($GITHUB_REF_NAME) não é writer-os-v$VERSAO nem writer-os-v$VERSAO-teste.N"; exit 1; }
          # uma de teste com a versão de uma estável que já saiu nunca chega ao pendrive: o Gravador de teste
          # escolhe a estável (X.Y.Z vale mais que X.Y.Z-teste.N) e grava a imagem velha (18/11). Sobe a versão da casca.
          if [[ "$GITHUB_REF_NAME" == *-teste.* ]] && gh release view "writer-os-v$VERSAO" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "writer-os-v$VERSAO já saiu como estável: suba a versão em sistema/writer-os/casca/package.json antes de uma de teste"; exit 1
          fi
          # a imagem leva a versão INTEIRA da tag (X.Y.Z ou X.Y.Z-teste.N): é com ela que um pendrive de teste compara a
          # próxima de teste (as atualizações) e é ela que diz o canal (/etc/ekfrase/canal)
          echo "VERSAO=${GITHUB_REF_NAME#writer-os-v}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node sistema/writer-os/casca/scripts/montar.ts --os --sem-abrir
      - name: Montar a imagem (Debian trixie, num contêiner)
        run: |
          docker run --rm --privileged -e VERSAO="$VERSAO" -e DONO="$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src debian:trixie bash sistema/writer-os/imagem/montar.sh
      - name: QEMU, OVMF e KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf dosfstools gdisk ntfs-3g minisign
      - run: df -h / "$PWD"
      - run: python3 tests/writer-os/qemu.py --imagem "sistema/writer-os/imagem/saida/ekfrase-writer-os-$VERSAO-teste.img" --prints prints-writer-os
      # os prints e a serial de cada máquina virtual (para entender uma falha sem rodar de novo)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-os-prints
          path: prints-writer-os
          if-no-files-found: ignore
          retention-days: 7
      - name: Comprimir e montar o manifesto da atualização (a assinatura é no job assinar)
        run: |
          cd sistema/writer-os/imagem/saida
          xz -T0 -6 "ekfrase-writer-os-$VERSAO.img"
          sha256sum "ekfrase-writer-os-$VERSAO.img.xz" > "ekfrase-writer-os-$VERSAO.img.xz.sha256"
          # a atualização: o manifesto (o formato de packages/atualizacoes/src/manifesto.ts, que o ekfrase-atualizar.sh lê)
          N="ekfrase-writer-os-$VERSAO"
          CANAL=estavel
          [[ "$VERSAO" == *-teste.* ]] && CANAL=teste
          arq() { jq -n --arg p "$1" --arg n "$2" --argjson t "$(stat -c %s "$2")" --arg s "$(sha256sum "$2" | cut -d' ' -f1)" '{papel: $p, nome: $n, tamanho: $t, sha256: $s}'; }
          { arq squashfs "$N.squashfs"; arq vmlinuz "$N.vmlinuz"; arq initrd "$N.initrd"; arq grub.cfg "$N.grub.cfg"; } | jq -s . > "$RUNNER_TEMP/arquivos.json"
          jq -n --arg v "$VERSAO" --arg c "$CANAL" --slurpfile a "$RUNNER_TEMP/arquivos.json" '{app: "ekfrase-writer-os", versao: $v, canal: $c, arquivos: $a[0]}' > "$N.atualizacao.json"
          # a chave de teste das atualizações nunca vai ao Release
          rm -f teste-atualizacao.key
      - uses: actions/upload-artifact@v4
        with:
          name: writer-os-imagem
          path: |
            sistema/writer-os/imagem/saida/*.img.xz
            sistema/writer-os/imagem/saida/*.sha256
            sistema/writer-os/imagem/saida/*.atualizacao.json
            sistema/writer-os/imagem/saida/*.squashfs
            sistema/writer-os/imagem/saida/*.vmlinuz
            sistema/writer-os/imagem/saida/*.initrd
            sistema/writer-os/imagem/saida/*.grub.cfg
            sistema/writer-os/imagem/saida/*.pacotes.tsv
          if-no-files-found: error
          compression-level: 0

  # o lacre da imagem e do manifesto: só o artefato (nada de npm, Docker nem código do ramo além da chave pública)
  assinar:
    name: O lacre da imagem
    needs: imagem
    runs-on: ubuntu-24.04
    environment: assinatura
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: writer-os-imagem
          path: saida
      - uses: actions/checkout@v5
        with:
          path: fonte
          sparse-checkout: sistema/writer-os/imagem/minisign.pub
          sparse-checkout-cone-mode: false
      - name: Assinar a imagem e o manifesto da atualização
        env:
          CHAVE: ${{ secrets.EKFRASE_MINISIGN_CHAVE }}
        run: |
          test -n "$CHAVE" || { echo "Falta o segredo EKFRASE_MINISIGN_CHAVE (no environment assinatura)."; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          VERSAO="${GITHUB_REF_NAME#writer-os-v}"
          N="ekfrase-writer-os-$VERSAO"
          PUB="$GITHUB_WORKSPACE/fonte/sistema/writer-os/imagem/minisign.pub"
          cd saida
          sha256sum -c "$N.img.xz.sha256"
          ( umask 077; printf '%s\n' "$CHAVE" > "$RUNNER_TEMP/minisign.key" )
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$N.img.xz" -t "Ekfrase Writer OS $VERSAO" < /dev/null
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$N.atualizacao.json" -t "Ekfrase Writer OS $VERSAO atualizacao" < /dev/null
          rm -f "$RUNNER_TEMP/minisign.key"
          minisign -V -p "$PUB" -m "$N.img.xz"
          minisign -V -p "$PUB" -m "$N.atualizacao.json"
      # só os lacres sobem de novo (a imagem já está no artefato writer-os-imagem)
      - uses: actions/upload-artifact@v4
        with:
          name: writer-os-lacres
          path: saida/*.minisig
          if-no-files-found: error

  gravador:
    name: Gravador (${{ matrix.os }})
    strategy:
      # um sistema que falha não cancela o outro (o VHD do Windows tem de rodar mesmo se o Linux cair)
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: sistema/writer-os/gravador
      - name: Electron no Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run gravador:roteiro
      # o "preparar" (Resize-Partition) e o "remover" de verdade, num VHD que faz o papel do disco do computador (PLANO §8c)
      - name: Preparar e remover o Writer OS do computador (num VHD)
        if: runner.os == 'Windows'
        run: node tests/gravador/computador-vhd.ts
      # a versão do Gravador é a da tag (U2: é com ela que ele se atualiza sozinho)
      - run: echo "EKFRASE_GRAVADOR_VERSAO=${GITHUB_REF_NAME#writer-os-v}" >> "$GITHUB_ENV"
        shell: bash
      - run: npm run gravador:pacote
        env:
          # o Gravador de uma tag de teste vê as pré-releases de teste (src/nucleo/origem.ts); o do público, nunca
          EKFRASE_GRAVADOR_CANAL: ${{ contains(github.ref_name, '-teste.') && 'teste' || 'estavel' }}
      - uses: actions/upload-artifact@v4
        with:
          name: gravador-${{ runner.os }}
          path: |
            sistema/writer-os/gravador/instalador/Gravador-Writer-OS.exe
            sistema/writer-os/gravador/instalador/Gravador-Writer-OS.AppImage
          if-no-files-found: error

  release:
    needs: [assinar, gravador]
    runs-on: ubuntu-latest
    environment: assinatura
    permissions:
      contents: write
      actions: write
    steps:
      # só a imagem (com a atualização) e os Gravadores: os prints e a serial do QEMU ficam como artefato, fora do Release
      - uses: actions/download-artifact@v4
        with:
          name: writer-os-imagem
          path: arquivos
      - uses: actions/download-artifact@v4
        with:
          name: writer-os-lacres
          path: arquivos
      - uses: actions/download-artifact@v4
        with:
          pattern: gravador-*
          path: arquivos
          merge-multiple: true
      - uses: actions/checkout@v5
        with:
          path: fonte
          sparse-checkout: sistema/writer-os/imagem/minisign.pub
          sparse-checkout-cone-mode: false
      # o Gravador se atualiza sozinho (U2, docs/ATUALIZACOES.md §5): o manifesto ekfrase-gravador-<v>.atualizacao.json (o
      # formato de packages/atualizacoes/src/manifesto.ts) com o lacre, e um .minisig de cada Gravador
      - name: O lacre dos Gravadores e o manifesto da atualização deles
        env:
          CHAVE: ${{ secrets.EKFRASE_MINISIGN_CHAVE }}
        run: |
          test -n "$CHAVE" || { echo "Falta o segredo EKFRASE_MINISIGN_CHAVE."; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          VERSAO="${GITHUB_REF_NAME#writer-os-v}"
          CANAL=estavel
          [[ "$VERSAO" == *-teste.* ]] && CANAL=teste
          cd arquivos
          ( umask 077; printf '%s\n' "$CHAVE" > "$RUNNER_TEMP/minisign.key" )
          for g in Gravador-Writer-OS.exe Gravador-Writer-OS.AppImage; do
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$g" -t "Ekfrase Gravador $VERSAO" < /dev/null
          done
          arq() { jq -n --arg p "$1" --arg n "$2" --argjson t "$(stat -c %s "$2")" --arg s "$(sha256sum "$2" | cut -d' ' -f1)" '{papel: $p, nome: $n, tamanho: $t, sha256: $s}'; }
          { arq windows Gravador-Writer-OS.exe; arq linux Gravador-Writer-OS.AppImage; } | jq -s . > "$RUNNER_TEMP/gravadores.json"
          N="ekfrase-gravador-$VERSAO"
          jq -n --arg v "$VERSAO" --arg c "$CANAL" --slurpfile a "$RUNNER_TEMP/gravadores.json" '{app: "ekfrase-gravador", versao: $v, canal: $c, arquivos: $a[0]}' > "$N.atualizacao.json"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$N.atualizacao.json" -t "Ekfrase Gravador $VERSAO atualizacao" < /dev/null
          rm -f "$RUNNER_TEMP/minisign.key"
          for f in Gravador-Writer-OS.exe Gravador-Writer-OS.AppImage "$N.atualizacao.json"; do
            minisign -V -p "$GITHUB_WORKSPACE/fonte/sistema/writer-os/imagem/minisign.pub" -m "$f"
          done
      - name: Criar o Release (a imagem com o lacre e o Gravador)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="${GITHUB_REF_NAME#writer-os-v}"
          if [[ "$GITHUB_REF_NAME" == *-teste.* ]]; then
            # pré-release: o releases/latest, a página ekfrase.com/writer/os/ e o Gravador do público não a veem
            gh release create "$GITHUB_REF_NAME" arquivos/* --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Ekfrase Writer OS $versao (TESTE)" \
              --notes "Versão de TESTE, para conferir num computador de verdade antes de publicar. O Gravador DESTA página baixa a imagem de teste; o Gravador do público ignora esta versão."
            exit 0
          fi
          # o aviso de segurança confere a imagem nova (e fecha o aviso aberto, se ela está em dia); o trap roda depois do create
          trap 'gh workflow run writer-os-seguranca.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "::warning::o aviso de segurança não rodou"' EXIT
          gh release create "$GITHUB_REF_NAME" arquivos/* --repo "$GITHUB_REPOSITORY" \
            --title "Ekfrase Writer OS $versao" \
            --notes "Para criar o pendrive: baixe o Gravador (Windows: Gravador-Writer-OS.exe; Linux: Gravador-Writer-OS.AppImage), que baixa e confere a imagem sozinho. Para o Rufus ou o balenaEtcher: o .img.xz (confira o .sha256 e o lacre .minisig com a chave em sistema/writer-os/imagem/minisign.pub). Passo a passo em https://ekfrase.com/writer/os/"
