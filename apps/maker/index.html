<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<!-- Nenhum texto de interface aqui: tudo vem de locales/*.json pelos atributos data-i18n. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title></title>
    <link rel="icon" type="image/png" href="/icone-64.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="./">
          <img class="logo" src="/src/img/logo-maker.png" width="40" height="40" alt="" />
          <div>
            <h1 data-i18n="app.title"></h1>
            <p class="subtitle" data-i18n="app.subtitle"></p>
          </div>
        </a>
        <!-- Os botões-ícone de todo app Ekfrase (passeio, idioma, tema, feedback, conta): src/casca.tsx. -->
        <div id="acoes-topo"></div>
      </header>

      <main class="stage" id="stage">
        <canvas id="map" tabindex="0" role="img" data-i18n-aria-label="map.label"></canvas>

        <div class="hud hud-level">
          <span class="badge" id="level-badge"></span>
          <span id="level-spacing"></span>
        </div>

        <div class="hud hud-tools">
          <div class="seg" role="group" data-i18n-aria-label="mode.label">
            <button class="seg-btn" id="mode-explore" data-i18n="mode.explore" data-i18n-title="mode.exploreHint"></button>
            <button class="seg-btn" id="mode-edit" data-i18n="mode.edit" data-i18n-title="mode.editHint"></button>
          </div>
          <div class="seg" role="group" data-i18n-aria-label="style.label">
            <button class="seg-btn" id="style-map" data-i18n="style.map" data-i18n-title="style.mapHint"></button>
            <button class="seg-btn" id="style-satellite" data-i18n="style.satellite" data-i18n-title="style.satelliteHint"></button>
          </div>
        </div>

        <div class="hud hud-palette" id="toolbar" hidden>
          <div class="palette" role="toolbar" data-i18n-aria-label="palette.label">
            <div class="tool-grid">
              <button class="tool-btn" id="tool-select" data-i18n-title="tool.select" data-i18n-aria-label="tool.select">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 9-5.5 1.2L15 19l-2.6 1.2-2.6-5.9L6 18z" /></svg>
              </button>
              <button class="tool-btn" id="tool-brush" data-i18n-title="tool.brush" data-i18n-aria-label="tool.brush">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14.5 4.5l5 5-8.2 8.2-5-5zM6.3 12.7c-2 .3-3.1 2-3.3 5.8 2.2-.3 3.9-.6 5.2-1.9" />
                </svg>
              </button>
              <button class="tool-btn" id="tool-eraser" data-i18n-title="tool.eraser" data-i18n-aria-label="tool.eraser">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h12M5.5 15.5l9-9 4 4-9 9H8z" /></svg>
              </button>
              <button class="tool-btn" id="tool-label" data-i18n-title="tool.label" data-i18n-aria-label="tool.label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v13M8.5 19h7" /></svg>
              </button>
            </div>
            <div class="brush-pick" id="brush-pick"></div>
            <span class="brush-info" id="brush-info"></span>
          </div>
        </div>

        <div class="hud hud-loading" id="loading" hidden>
          <span class="spinner" aria-hidden="true"></span><span data-i18n="tiles.loading"></span>
        </div>

        <div class="hud hud-zoom">
          <button class="icon-btn" id="zoom-in" data-i18n-title="action.zoomIn" data-i18n-aria-label="action.zoomIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="icon-btn" id="zoom-out" data-i18n-title="action.zoomOut" data-i18n-aria-label="action.zoomOut">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
        </div>

        <div class="hud hud-scale">
          <div class="scale-bar" id="scale-bar"></div>
          <span id="scale-label"></span>
        </div>

        <p class="hud hud-hint" data-i18n="hint.controls"></p>
        <div class="toast" id="toast" role="status" hidden></div>
        <form class="label-form" id="label-form" hidden>
          <input id="label-new-name" type="text" maxlength="120" autocomplete="off" data-i18n-aria-label="label.name" />
          <select id="label-new-category" data-i18n-aria-label="label.category"></select>
          <button class="btn" type="submit" id="label-submit"></button>
          <button class="icon-btn small danger" type="button" id="label-form-delete" data-i18n-title="label.delete" data-i18n-aria-label="label.delete" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" /></svg>
          </button>
        </form>
      </main>

      <aside class="panel">
        <section class="card">
          <div class="card-head">
            <h2 data-i18n="doc.title"></h2>
            <span class="status" id="doc-status"></span>
          </div>
          <label class="field">
            <span data-i18n="doc.name"></span>
            <input id="doc-name" type="text" maxlength="256" autocomplete="off" spellcheck="false" />
          </label>
          <div class="btn-row">
            <button class="btn btn-secondary" id="doc-new" data-i18n="doc.new"></button>
            <button class="btn btn-secondary" id="doc-open" data-i18n="doc.open" data-i18n-title="doc.openHint"></button>
            <button class="btn" id="doc-save" data-i18n="doc.save" data-i18n-title="doc.saveHint"></button>
          </div>
          <div class="btn-row">
            <button class="btn btn-secondary" id="doc-import" data-i18n="doc.import" data-i18n-title="doc.importHint"></button>
            <button class="btn btn-secondary" id="doc-export" data-i18n="doc.export" data-i18n-title="doc.exportHint"></button>
          </div>
          <div class="btn-row">
            <button class="icon-btn small" id="doc-undo" data-i18n-title="doc.undo" data-i18n-aria-label="doc.undo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2" /></svg>
            </button>
            <button class="icon-btn small" id="doc-redo" data-i18n-title="doc.redo" data-i18n-aria-label="doc.redo">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h2" /></svg>
            </button>
            <span class="muted small grow" id="doc-edits"></span>
            <button class="link-btn" id="doc-json" data-i18n="doc.exportJson"></button>
          </div>
          <p class="muted small" data-i18n="doc.hint"></p>
          <input id="doc-file" type="file" accept=".ekfr,.ekfrase,application/vnd.ekfrase.ekfr+zip" hidden />
        </section>

        <section class="card">
          <h2 data-i18n="world.title"></h2>
          <label class="field">
            <span data-i18n="world.seed"></span>
            <span class="input-row">
              <input id="world-seed" type="text" maxlength="1024" autocomplete="off" spellcheck="false" />
            </span>
          </label>
          <div class="field-row">
            <label class="field">
              <span data-i18n="world.extentNs"></span>
              <input id="world-ns" type="number" min="1" max="20000" step="1" inputmode="numeric" />
            </label>
            <label class="field">
              <span data-i18n="world.extentEw"></span>
              <input id="world-ew" type="number" min="1" max="20000" step="1" inputmode="numeric" />
            </label>
          </div>
          <div class="btn-row">
            <button class="btn" id="world-apply" data-i18n="world.apply"></button>
            <button class="btn btn-secondary" id="world-fit" data-i18n="world.fit"></button>
          </div>
          <p class="muted small" id="world-generator"></p>
          <button class="btn btn-secondary" id="world-use-basic" data-i18n="world.useBasic" hidden></button>
          <p class="muted small" data-i18n="world.hint"></p>
        </section>

        <section class="card">
          <h2 data-i18n="level.title"></h2>
          <input id="level-slider" type="range" min="0" max="20" step="1" data-i18n-aria-label="level.slider" />
          <div class="ladder" id="level-ladder" aria-hidden="true"></div>
          <p class="muted" data-i18n="level.hint"></p>
          <p class="muted" id="visible-count"></p>
        </section>

        <section class="card" aria-live="polite">
          <div class="card-head">
            <h2 data-i18n="selection.title"></h2>
            <button
              class="icon-btn small"
              id="clear-selection"
              data-i18n-title="selection.clear"
              data-i18n-aria-label="selection.clear"
              hidden
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <p class="muted" id="selection-empty" data-i18n="selection.empty"></p>
          <div id="selection-body" hidden>
            <dl class="facts">
              <dt data-i18n="selection.address"></dt>
              <dd><code class="address" id="sel-address"></code></dd>
              <dt data-i18n="selection.digit"></dt>
              <dd id="sel-digit"></dd>
              <dt data-i18n="selection.center"></dt>
              <dd id="sel-center"></dd>
              <dt data-i18n="selection.parent"></dt>
              <dd>
                <button class="chip chip-parent" id="sel-parent"></button>
                <span class="muted" id="sel-no-parent" data-i18n="selection.noParent" hidden></span>
              </dd>
            </dl>
            <div id="terrain-info" hidden>
              <h3 data-i18n="terrain.title"></h3>
              <dl class="facts">
                <dt data-i18n="terrain.biome"></dt>
                <dd><span class="swatch inline" id="terrain-swatch"></span><span id="terrain-biome"></span></dd>
                <dt data-i18n="terrain.elevation"></dt>
                <dd id="terrain-elevation"></dd>
                <dt data-i18n="terrain.temperature"></dt>
                <dd id="terrain-temperature"></dd>
                <dt data-i18n="terrain.moisture"></dt>
                <dd id="terrain-moisture"></dd>
              </dl>
              <p class="muted small" id="terrain-painted"></p>
            </div>
            <h3 data-i18n="selection.children"></h3>
            <ol class="kids" id="sel-children"></ol>
            <p class="muted" id="sel-no-children" data-i18n="selection.noChildren" hidden></p>
            <h3 data-i18n="mark.title"></h3>
            <div class="marks" id="mark-swatches"></div>
            <p class="muted small" id="mark-status"></p>
            <p class="muted small" data-i18n="mark.hint"></p>
          </div>
        </section>

        <section class="card" id="label-card" hidden>
          <div class="card-head">
            <h2 data-i18n="label.title"></h2>
            <button class="link-btn" id="label-delete" data-i18n="label.delete"></button>
          </div>
          <label class="field">
            <span data-i18n="label.name"></span>
            <input id="label-edit-name" type="text" maxlength="120" autocomplete="off" />
          </label>
          <label class="field">
            <span data-i18n="label.category"></span>
            <select id="label-edit-category"></select>
          </label>
          <p class="muted small" data-i18n="label.hint"></p>
        </section>

        <section class="card">
          <h2 data-i18n="view.title"></h2>
          <label class="toggle"><input type="checkbox" id="opt-terrain" checked /><span data-i18n="view.showTerrain"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-upper" checked /><span data-i18n="view.showUpper"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-digits" checked /><span data-i18n="view.showDigits"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-align" /><span data-i18n="view.align"></span></label>
          <button class="btn" id="btn-diagram" data-i18n="action.diagram"></button>
          <p class="muted small" data-i18n="brush.hint"></p>
        </section>

        <section class="card">
          <h2 data-i18n="legend.title"></h2>
          <ul class="legend">
            <li><span class="sw sw-ideal"></span><span data-i18n="legend.ideal"></span></li>
            <li><span class="sw sw-overhang"></span><span data-i18n="legend.overhang"></span></li>
            <li><span class="sw sw-uncovered"></span><span data-i18n="legend.uncovered"></span></li>
            <li><span class="sw sw-parent"></span><span data-i18n="legend.parent"></span></li>
            <li><span class="sw sw-upper"></span><span data-i18n="legend.upper"></span></li>
          </ul>
          <p class="muted small" data-i18n="legend.note"></p>
          <h3 data-i18n="legend.biomes"></h3>
          <ul class="legend legend-biomes" id="biome-legend"></ul>
        </section>
      </aside>

      <!-- O rodapé de todo app Ekfrase (a marca fica só aqui): src/casca.tsx. -->
      <div class="rodape-maker" id="rodape"></div>
    </div>
    <!-- A tela inicial (quem ainda não entrou): src/casca.tsx. Cobre o editor até a conta responder. -->
    <div class="entrada-maker" id="entrada"></div>
    <div id="janelas"></div>
  </body>
</html>
